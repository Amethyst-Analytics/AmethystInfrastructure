# Standardized CI pipeline for the Amethyst Analytics monorepo.
# Single source of truth for all PR quality gates. Identical across all 5 repos.

name: PR Quality Gates

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ----- 1. All static checks via pre-commit (one source of truth, local == CI) -----
  pre-commit:
    name: Pre-commit (lint, format, type, secrets, docker, prettier)
    runs-on: ubuntu-latest
    if: github.event.pull_request.draft == false
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # gitleaks needs full history

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: pre-commit/action@v3.0.1

  # ----- 2. Tests + coverage (only if a tests/ directory exists) -----
  test-coverage:
    name: Tests & Coverage
    runs-on: ubuntu-latest
    if: github.event.pull_request.draft == false
    services:
      postgres:
        image: timescale/timescaledb:latest-pg16
        env:
          POSTGRES_USER: amethyst_app
          POSTGRES_PASSWORD: testpassword
          POSTGRES_DB: amethyst_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U amethyst_app -d amethyst_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7.2
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - name: Detect Python project
        id: detect
        run: |
          if [ -d tests ] && ([ -f pyproject.toml ] || [ -f requirements.txt ]); then
            echo "has_python_tests=true" >> $GITHUB_OUTPUT
          else
            echo "has_python_tests=false" >> $GITHUB_OUTPUT
            echo "No tests/ directory or Python project files - skipping test job."
          fi

      - uses: actions/setup-python@v5
        if: steps.detect.outputs.has_python_tests == 'true'
        with:
          python-version: "3.11"

      - name: Install dependencies
        if: steps.detect.outputs.has_python_tests == 'true'
        run: |
          pip install pytest pytest-cov coverage
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          if [ -f pyproject.toml ]; then pip install -e . || true; fi

      - name: Run tests with coverage
        if: steps.detect.outputs.has_python_tests == 'true'
        id: pytest
        run: pytest --cov=. --cov-report=xml --cov-report=term-missing --cov-fail-under=80
        continue-on-error: true

      - name: Post coverage comment
        if: steps.detect.outputs.has_python_tests == 'true'
        uses: MishaKav/pytest-coverage-comment@main
        with:
          pytest-xml-coverage-path: ./coverage.xml
          title: Test Coverage Report
          create-new-comment: false
        continue-on-error: true

      - name: Fail if tests failed
        if: steps.detect.outputs.has_python_tests == 'true' && steps.pytest.outcome == 'failure'
        run: exit 1

  # ----- 3. Dependency CVE scan -----
  dependency-security:
    name: Dependency Security (safety)
    runs-on: ubuntu-latest
    if: github.event.pull_request.draft == false
    steps:
      - uses: actions/checkout@v4

      - name: Detect Python deps
        id: detect
        run: |
          if [ -f requirements.txt ] || [ -f pyproject.toml ]; then
            echo "has_deps=true" >> $GITHUB_OUTPUT
          else
            echo "has_deps=false" >> $GITHUB_OUTPUT
            echo "No requirements.txt or pyproject.toml - skipping safety scan."
          fi

      - uses: actions/setup-python@v5
        if: steps.detect.outputs.has_deps == 'true'
        with:
          python-version: "3.11"

      - name: Install safety
        if: steps.detect.outputs.has_deps == 'true'
        run: pip install safety

      - name: safety
        if: steps.detect.outputs.has_deps == 'true'
        run: safety check --full-report
        continue-on-error: true

  # ----- 4. Service boundary check -----
  boundary-check:
    name: Service Boundary Check
    runs-on: ubuntu-latest
    if: github.event.pull_request.draft == false
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run boundary check
        run: python scripts/check_boundaries.py

  # ----- 5. Aggregated summary comment (single comment, updated in place) -----
  ci-summary:
    name: CI Summary
    runs-on: ubuntu-latest
    needs: [pre-commit, test-coverage, dependency-security, boundary-check]
    if: always() && github.event.pull_request.draft == false
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const results = {
              "Pre-commit (lint/type/secrets/docker/prettier)": "${{ needs.pre-commit.result }}",
              "Tests & Coverage": "${{ needs.test-coverage.result }}",
              "Dependency Security": "${{ needs.dependency-security.result }}",
              "Service Boundary":   "${{ needs.boundary-check.result }}",
            };
            const icon = (r) => r === "success" ? "✅" : r === "failure" ? "❌" : r === "skipped" ? "⏭️" : "⚠️";
            const rows = Object.entries(results)
              .map(([name, result]) => "| " + name + " | " + icon(result) + " " + result + " |")
              .join("\n");
            const allGood = Object.values(results).every(r => r === "success" || r === "skipped");
            const footer = allGood
              ? "✅ All gates passed. PR is ready for review."
              : "❌ One or more gates failed.";
            const body = "## CI Quality Gate Summary\n\n| Gate | Result |\n|---|---|\n" + rows + "\n\n" + footer;
            const comments = await github.rest.issues.listComments({
              owner: context.repo.owner, repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.data.find(c => c.body.includes("CI Quality Gate Summary"));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner, repo: context.repo.repo,
                comment_id: existing.id, body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: context.issue.number, body,
              });
            }
